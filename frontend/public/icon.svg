<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Brand Teal Gradient Background -->
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5F80" />
      <stop offset="50%" stop-color="#0B4F6C" />
      <stop offset="100%" stop-color="#041E2B" />
    </linearGradient>

    <!-- Subtle Gold Calligraphy Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7C8" />
    </linearGradient>

    <!-- Outer Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#041E2B" flood-opacity="0.5" />
    </filter>

    <!-- Text Glow / Shadow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" ry="120" fill="url(#brandTeal)" filter="url(#dropShadow)" />

  <!-- Inner Gold Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="108" ry="108" fill="none" stroke="#D99B38" stroke-width="10" stroke-opacity="0.5" />

  <!-- Arabic / Urdu Calligraphy "حق" (Haq) -->
  <g filter="url(#textGlow)">
    <text
      x="256"
      y="348"
      font-family="'Noto Naskh Arabic', 'Scheherazade New', 'Amiri', 'Urdu Typesetting', 'Geeza Pro', 'Traditional Arabic', system-ui, sans-serif"
      font-size="280"
      font-weight="900"
      text-anchor="middle"
      fill="url(#goldText)"
      letter-spacing="-0.02em"
    >حق</text>
  </g>
</svg>
